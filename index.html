<!doctype html>
<html lang="ja"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>フルーツキャッチ | もぎたて広場</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#fff9ec;color:#244b38;font-family:'Yu Gothic','Hiragino Sans',sans-serif}header{max-width:1020px;margin:auto;padding:22px 24px;display:flex;justify-content:space-between;align-items:center}.brand{font-weight:900;font-size:19px}.tag{font-size:12px;letter-spacing:2px;color:#72806a}main{max-width:960px;margin:auto;padding:0 18px 24px}.heading{text-align:center;margin:5px 0 19px}.heading p{margin:8px;color:#667b66;font-size:14px}h1{font-size:clamp(29px,5vw,46px);margin:0;letter-spacing:2px}.hud{display:flex;gap:10px;align-items:center;margin-bottom:12px}.stat{background:white;border:1px solid #e5e8d6;border-radius:18px;padding:10px 20px;flex:1}.stat small{font-size:11px;display:block;color:#7c8c73}.stat strong{font-size:26px}.stat span{font-size:13px;margin-left:4px}button,select{font:inherit}button{cursor:pointer;border:0;border-radius:14px;background:#2d6748;color:white;padding:13px 20px;font-weight:bold;touch-action:manipulation}button:hover{filter:brightness(1.08)}button:focus-visible,select:focus-visible{outline:3px solid #ecaa39;outline-offset:3px}.quiet{background:#e9efdf;color:#31543b}.field{position:relative;height:min(56vh,480px);min-height:300px;border:4px solid white;box-shadow:0 8px 30px #455b2e15;border-radius:28px;overflow:hidden;background:#e6f1d8}canvas{width:100%;height:100%;display:block;touch-action:none}.overlay{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;background:#eaf2dc85;padding:20px}.overlay[hidden]{display:none}.card{text-align:center;background:#fffdf4f5;border:1px solid white;padding:25px 32px;border-radius:25px;box-shadow:0 12px 35px #36553716;max-width:430px}.hero{font-size:49px}.card h2{font-size:25px;margin:8px 0}.card p{line-height:1.8;font-size:14px;color:#61725e;margin:8px 0 18px}.card select{padding:9px;border:1px solid #d7dfc9;border-radius:10px;background:#fff;color:#31543b;margin:0 0 15px}.start{display:block;width:100%;background:#e9a439;color:#354629;font-size:18px}.instructions{display:flex;justify-content:space-between;gap:15px;padding:17px 7px;font-size:13px;color:#6c7c65}.legend{display:flex;gap:14px;flex-wrap:wrap}.foot{text-align:center;font-size:11px;color:#8a947d}.mobile{display:none}@media(max-width:600px){header{padding:17px 20px}.tag{display:none}.heading{margin:0 0 15px}.heading p{font-size:12px}.stat{padding:9px 12px;border-radius:14px}.stat strong{font-size:22px}.hud{gap:6px}.hud button{padding:12px}.instructions{display:block;line-height:1.9}.legend{gap:12px}.desktop{display:none}.mobile{display:inline}.card{padding:20px}.field{height:53vh}}
</style>
<header><div class="brand">🍊 もぎたて広場</div><div class="tag">CULTURE FESTIVAL · PLAY & SMILE</div></header>
<main><div class="heading"><h1>フルーツキャッチ</h1><p>おいしいフルーツ、かごいっぱいにつかまえよう！</p></div>
<div class="hud"><div class="stat"><small>スコア</small><strong id="score">0</strong><span>点</span></div><div class="stat"><small>のこり時間</small><strong id="time">60</strong><span>秒</span></div><div class="stat"><small>ベスト</small><strong id="best">0</strong><span>点</span></div><button class="quiet" id="pause" disabled aria-label="一時停止">休憩</button></div>
<div class="field"><canvas id="game" aria-label="フルーツキャッチ。左右キー、マウス、または指でかごを動かします。"></canvas><div class="overlay" id="overlay"><div class="card"><div class="hero" id="hero">🍎🍊🍇</div><h2 id="title">さあ、収穫のじかん！</h2><p id="message">フルーツは <b>+10点</b>、きんのりんごは <b>+30点</b>。<br>ばくだんは <b>−20点</b>！ よけてね。</p><div id="options"><label for="level">むずかしさ </label><select id="level"><option value="easy">やさしい</option><option value="normal" selected>ふつう</option><option value="hard">むずかしい</option></select></div><button class="start" id="start">あそぶ！</button></div></div></div>
<div class="instructions"><div class="legend"><span>🍎 フルーツ +10</span><span>🌟 きんのりんご +30</span><span>💣 ばくだん −20</span></div><div><span class="desktop">← → キー / マウスで移動</span><span class="mobile">指でなぞって、かごを動かそう</span></div></div><div class="foot">1回60秒 · フルーツを落としても大丈夫！</div><div role="status" aria-live="polite" id="announcement" style="position:absolute;left:-9999px"></div></main>
<script>
'use strict';
const $=id=>document.getElementById(id),c=$('game'),ctx=c.getContext('2d');let W=900,H=450,x=450,items=[],sparks=[],score=0,remaining=60,mode='ready',last=0,spawn=0,elapsed=0,best=0,keys={},level='normal',resumeMode=false;
try{best=Number(localStorage.getItem('fruit-catch-best-v1'))||0}catch{}$('best').textContent=best;
function resize(){const r=c.getBoundingClientRect();let ratio=x/W;W=r.width;H=r.height;c.width=W*devicePixelRatio;c.height=H*devicePixelRatio;ctx.setTransform(devicePixelRatio,0,0,devicePixelRatio,0,0);x=ratio*W}new ResizeObserver(resize).observe(c);
function hud(){$('score').textContent=score;$('time').textContent=Math.ceil(remaining);$('best').textContent=best}
function start(){level=$('level').value;score=0;remaining=60;elapsed=0;spawn=.4;items=[];sparks=[];x=W/2;mode='playing';$('overlay').hidden=true;$('pause').disabled=false;$('pause').textContent='休憩';keys={};hud()}
function show(title,message,button,hero){$('title').textContent=title;$('message').innerHTML=message;$('start').textContent=button;$('hero').textContent=hero;$('options').hidden=mode==='paused';$('overlay').hidden=false}
function pause(){if(mode==='playing'){mode='paused';keys={};show('ちょっと、ひとやすみ','準備ができたら、つづけよう！','つづける','🌿');$('pause').textContent='再開'}else if(mode==='paused'){mode='playing';$('overlay').hidden=true;$('pause').textContent='休憩'}}
$('start').onclick=()=>mode==='paused'?pause():start();$('pause').onclick=pause;
function finish(){mode='finished';$('pause').disabled=true;if(score>best){best=score;try{localStorage.setItem('fruit-catch-best-v1',best)}catch{}}hud();show('たくさんとれたね！',`今回のスコアは <b style="font-size:28px;color:#2d6748">${score}点</b><br>次のおともだちも、チャレンジしてね。`,'もう一度あそぶ',score>=400?'🏆':'🧺');$('announcement').textContent=`ゲーム終了。${score}点です。`}
function move(clientX){const r=c.getBoundingClientRect();x=Math.max(48,Math.min(W-48,clientX-r.left))}c.onpointerdown=e=>{if(mode==='playing'){c.setPointerCapture(e.pointerId);move(e.clientX)}};c.onpointermove=e=>{if(mode==='playing'&&(e.pointerType==='mouse'||e.buttons))move(e.clientX)};
window.addEventListener('keydown',e=>{if((e.key==='ArrowLeft'||e.key==='ArrowRight')&&mode==='playing'){e.preventDefault();keys[e.key]=true}if(e.key==='Escape')pause()});window.addEventListener('keyup',e=>keys[e.key]=false);window.addEventListener('blur',()=>{keys={};if(mode==='playing')pause()});document.addEventListener('visibilitychange',()=>{if(document.hidden&&mode==='playing')pause()});
function roundRect(a,b,w,h,r,color){ctx.fillStyle=color;ctx.beginPath();ctx.roundRect(a,b,w,h,r);ctx.fill()}
function draw(t){ctx.clearRect(0,0,W,H);ctx.fillStyle='#e6f1d8';ctx.fillRect(0,0,W,H);ctx.fillStyle='#ffffff90';for(let i=0;i<5;i++){let a=((i*223+t*3)%(W+180))-90;ctx.beginPath();ctx.ellipse(a,50+i%2*55,65,18,0,0,7);ctx.fill()}ctx.fillStyle='#cbdcab';ctx.beginPath();ctx.ellipse(W*.2,H+25,W*.6,105,0,0,7);ctx.fill();ctx.fillStyle='#b9d29a';ctx.beginPath();ctx.ellipse(W*.9,H+50,W*.6,120,0,0,7);ctx.fill();for(let i=0;i<12;i++){ctx.fillStyle='#fff8d8';ctx.beginPath();ctx.arc(i*87+20,H-20-(i%3)*14,3,0,7);ctx.fill()}
for(const f of items){ctx.save();ctx.translate(f.x,f.y);ctx.rotate(Math.sin(f.y/60)*.16);if(f.kind==='gold'){ctx.shadowColor='#f9b52e';ctx.shadowBlur=17;ctx.fillStyle='#e8a820';ctx.beginPath();ctx.arc(0,0,17,0,7);ctx.fill();ctx.shadowBlur=0;ctx.fillStyle='#fff6ac';ctx.font='bold 24px sans-serif';ctx.textAlign='center';ctx.fillText('★',0,8)}else{ctx.font='34px "Segoe UI Emoji",sans-serif';ctx.textAlign='center';ctx.textBaseline='middle';ctx.fillText(f.emoji,0,0)}ctx.restore()}
ctx.save();ctx.translate(x,H-49);ctx.strokeStyle='#997046';ctx.lineWidth=5;ctx.beginPath();ctx.ellipse(0,-6,26,22,0,Math.PI,Math.PI*2);ctx.stroke();ctx.fillStyle='#b47b42';ctx.beginPath();ctx.moveTo(-44,-8);ctx.lineTo(44,-8);ctx.lineTo(34,26);ctx.quadraticCurveTo(0,35,-34,26);ctx.closePath();ctx.fill();ctx.strokeStyle='#dba467';ctx.lineWidth=3;for(let i=-25;i<35;i+=13){ctx.beginPath();ctx.moveTo(i,-4);ctx.lineTo(i*.8,24);ctx.stroke()}roundRect(-47,-11,94,9,4,'#e4b46c');ctx.fillStyle='#654629';ctx.beginPath();ctx.arc(-10,9,2,0,7);ctx.arc(10,9,2,0,7);ctx.fill();ctx.beginPath();ctx.arc(0,10,5,0,Math.PI);ctx.strokeStyle='#654629';ctx.lineWidth=2;ctx.stroke();ctx.restore();
for(const s of sparks){ctx.globalAlpha=Math.max(0,s.life);ctx.fillStyle=s.value>0?'#326744':'#b44839';ctx.font='bold 24px sans-serif';ctx.textAlign='center';ctx.fillText((s.value>0?'+':'')+s.value,s.x,s.y)}ctx.globalAlpha=1}
function frame(now){const dt=Math.min((now-last)/1000||0,.05);last=now;if(mode==='playing'){elapsed+=dt;remaining=Math.max(0,60-elapsed);const speed=level==='easy'?125:level==='hard'?240:175;let direction=(keys.ArrowRight?1:0)-(keys.ArrowLeft?1:0);x=Math.max(48,Math.min(W-48,x+direction*W*.95*dt));spawn-=dt;if(spawn<=0){spawn=level==='easy'?.76:level==='hard'?.38:.55;const r=Math.random(),kind=r<.12?'gold':r<(level==='easy'?.20:.29)?'bomb':'fruit';items.push({x:25+Math.random()*(W-50),y:-25,speed:speed*(.8+Math.random()*.4)*(H/450)*(1+elapsed/150),kind,emoji:kind==='bomb'?'💣':['🍎','🍊','🍐','🍇','🍓'][Math.floor(Math.random()*5)]})}for(const f of items){f.y+=f.speed*dt;if(f.y>=H-67&&f.y<=H-25&&Math.abs(f.x-x)<53){const v=f.kind==='gold'?30:f.kind==='bomb'?-20:10;score=Math.max(0,score+v);sparks.push({x:f.x,y:H-85,value:v,life:1});f.y=H+100}}items=items.filter(f=>f.y<H+40);for(const s of sparks){s.life-=dt;s.y-=35*dt}sparks=sparks.filter(s=>s.life>0);hud();if(remaining<=0)finish()}draw(now/1000);requestAnimationFrame(frame)}requestAnimationFrame(frame);
</script></html>
